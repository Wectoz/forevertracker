{% extends "base.html" %}
{% block head %}<link rel="preload" href="{{ url_for('search_index') }}" as="fetch" crossorigin>{% endblock %}
{% block content %}
<h1>Search</h1>
<form class="search" role="search" data-index="{{ url_for('search_index') }}">
  <label for="q" class="visually-hidden">Search news and class changes</label>
  <input id="q" name="q" type="search" placeholder="e.g. Mortal Strike, hotfix, Hunter pets" autocomplete="off">
  <button type="submit">Search</button>
</form>
<p class="search-status" role="status" aria-live="polite"></p>
<ol class="results"></ol>
<noscript><p class="note">Search needs JavaScript. Browse the <a href="{{ url_for('patches') }}">patch list</a> or pick a class from the menu instead.</p></noscript>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='search.js') }}" defer></script>{% endblock %}
