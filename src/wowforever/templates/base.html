<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }}</title>
  <meta name="description" content="{{ description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="{{ url_for('home') }}">WOW FOREVER TRACKER</a>
      <nav aria-label="Main">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('news') }}">News</a>
        <a href="{{ url_for('patches') }}">Patches</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <p class="banner">{{ banner }}</p>
    {% block content %}{% endblock %}
  </main>
  <footer class="wrap site-footer">
    <p>Unofficial fan site. Not affiliated with Blizzard Entertainment.</p>
  </footer>
</body>
</html>
