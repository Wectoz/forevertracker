<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" preserveAspectRatio="xMidYMax slice">
  <!-- Mulgore at dusk: golden plains below the mesas of Thunder Bluff. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2a3a"/>
      <stop offset=".45" stop-color="#5b4a52"/>
      <stop offset=".72" stop-color="#c47a42"/>
      <stop offset="1" stop-color="#f0b665"/>
    </linearGradient>
    <radialGradient id="glow" cx="560" cy="218" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe2a8" stop-opacity=".85"/>
      <stop offset=".25" stop-color="#f4b866" stop-opacity=".45"/>
      <stop offset="1" stop-color="#f4b866" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mesa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5048"/>
      <stop offset="1" stop-color="#4d3436"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6656"/>
      <stop offset="1" stop-color="#9c7a5a"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a39046"/>
      <stop offset="1" stop-color="#6c6428"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8893a"/>
      <stop offset="1" stop-color="#6e4a1e"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0a08" stop-opacity="0"/>
      <stop offset="1" stop-color="#0c0a08"/>
    </linearGradient>
    <pattern id="grass" width="60" height="40" patternUnits="userSpaceOnUse">
      <path d="M6 40 Q8 24 4 14 M10 40 Q12 26 16 18 M14 40 Q13 30 10 24 M34 40 Q36 22 32 10 M38 40 Q40 28 46 20 M42 40 Q41 30 38 26 M52 40 Q54 30 58 26"
            fill="none" stroke="#d9a35b" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
    </pattern>
  </defs>

  <rect width="1600" height="360" fill="url(#sky)"/>
  <rect width="1600" height="360" fill="url(#glow)"/>

  <!-- Low sun and streaks of cloud -->
  <circle cx="560" cy="214" r="34" fill="#ffe9bd"/>
  <g fill="#f3c886" opacity=".5">
    <path d="M120 120 q120 -14 260 -2 q-130 10 -260 2z"/>
    <path d="M420 86 q160 -16 330 0 q-170 12 -330 0z"/>
    <path d="M1240 70 q140 -12 280 0 q-140 10 -280 0z"/>
    <path d="M780 150 q110 -8 220 0 q-110 7 -220 0z" opacity=".7"/>
  </g>

  <!-- Distant ridge -->
  <path d="M0 214 Q120 196 240 206 T480 202 T720 210 T960 198 T1200 206 T1440 196 T1600 204 V260 H0z" fill="url(#far)" opacity=".85"/>

  <!-- Thunder Bluff: flat-topped mesas joined by rope bridges, tents and totems on top -->
  <!-- Scaled toward the right edge so the page's centre column does not hide it on wide screens. -->
  <g transform="translate(527 63) scale(.75)">
  <g fill="url(#mesa)">
    <path d="M850 250 L872 176 L878 160 L938 158 L946 182 L962 250z"/>
    <path d="M968 252 L990 132 L996 102 L1126 98 L1134 126 L1158 252z"/>
    <path d="M1178 252 L1196 150 L1202 126 L1290 122 L1298 150 L1322 252z"/>
    <path d="M1330 252 L1348 190 L1354 176 L1404 174 L1412 196 L1430 252z"/>
  </g>
  <g fill="none" stroke="#3a2628" stroke-width="2">
    <path d="M938 162 Q954 176 996 112"/>
    <path d="M1126 104 Q1162 126 1202 130"/>
    <path d="M1290 128 Q1324 162 1354 180"/>
  </g>
  <g fill="#3a2628">
    <path d="M1012 98 l10 -22 l10 22z M1046 98 l13 -28 l13 28z M1088 98 l9 -18 l9 18z"/>
    <path d="M1220 122 l11 -24 l11 24z M1258 122 l9 -18 l9 18z"/>
    <path d="M896 158 l8 -16 l8 16z"/>
    <rect x="1078" y="66" width="4" height="32"/>
    <rect x="1074" y="72" width="12" height="4"/>
    <rect x="1246" y="96" width="4" height="26"/>
  </g>
  <g stroke="#3a2628" stroke-width="1.5">
    <path d="M1059 70 l-4 -8 M1059 70 l4 -8 M1022 76 l-3 -6 M1022 76 l3 -6 M1231 98 l-3 -7 M1231 98 l3 -7"/>
  </g>
  <!-- Bluff faces catch the sun on their left -->
  <g fill="#e09a5a" opacity=".22">
    <path d="M968 252 L990 132 L996 102 L1010 102 L1000 252z"/>
    <path d="M1178 252 L1196 150 L1202 126 L1214 126 L1204 252z"/>
  </g>
  </g>

  <!-- Rolling hills -->
  <path d="M0 236 C140 214 260 226 380 232 S640 218 780 232 S1060 246 1220 236 S1480 222 1600 232 V300 H0z" fill="url(#mid)"/>

  <!-- Tauren tents on the plain -->
  <g>
    <path d="M330 242 l22 -46 l22 46z" fill="#d8b27a"/>
    <path d="M352 196 l-6 -10 M352 196 l6 -10" stroke="#3a2a1a" stroke-width="2"/>
    <path d="M346 242 l6 -14 l6 14z" fill="#3a2a1a"/>
    <path d="M336 228 h32" stroke="#8c3a22" stroke-width="3"/>
    <path d="M392 246 l17 -36 l17 36z" fill="#c9a06a"/>
    <path d="M409 210 l-5 -8 M409 210 l5 -8" stroke="#3a2a1a" stroke-width="2"/>
    <path d="M397 236 h24" stroke="#2e5a6a" stroke-width="3"/>
    <path d="M370 244 q4 -14 -2 -26 q10 10 4 26z" fill="#ffd27a" opacity=".8"/>
  </g>

  <!-- Golden foreground plain -->
  <path d="M0 262 C180 246 360 256 540 264 S900 250 1080 258 S1420 270 1600 254 V360 H0z" fill="url(#near)"/>
  <path d="M0 262 C180 246 360 256 540 264 S900 250 1080 258 S1420 270 1600 254 V360 H0z" fill="url(#grass)"/>

  <!-- Lone tree -->
  <g transform="translate(1080 262)">
    <path d="M-3 0 q2 -26 -6 -46 M1 0 q2 -24 10 -40" stroke="#3a2a1a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse cx="-12" cy="-52" rx="30" ry="14" fill="#5d6a2a"/>
    <ellipse cx="16" cy="-46" rx="26" ry="12" fill="#6c7a30"/>
    <ellipse cx="0" cy="-62" rx="22" ry="10" fill="#7a8838"/>
  </g>

  <!-- Totem in the foreground -->
  <g transform="translate(170 300)">
    <rect x="-9" y="-112" width="18" height="112" fill="#4a2e14"/>
    <rect x="-13" y="-112" width="26" height="22" rx="3" fill="#8c3a22"/>
    <rect x="-13" y="-84" width="26" height="20" rx="3" fill="#2e5a6a"/>
    <rect x="-13" y="-58" width="26" height="20" rx="3" fill="#b5773a"/>
    <path d="M-13 -106 l-30 -10 l6 14z M13 -106 l30 -10 l-6 14z" fill="#d9a35b"/>
    <path d="M-5 -102 h3 M2 -102 h3 M-5 -76 h3 M2 -76 h3 M-5 -50 h3 M2 -50 h3" stroke="#16130f" stroke-width="2"/>
    <path d="M-2 -126 l2 -14 l2 14z" fill="#ffe2a8"/>
  </g>

  <rect y="250" width="1600" height="110" fill="url(#fade)"/>
</svg>
