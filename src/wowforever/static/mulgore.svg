<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" preserveAspectRatio="xMidYMax slice">
  <!-- Mulgore at dusk: Thunder Bluff's cliff on the left, the red mesas on the right, Bloodhoof Village by the water
       between them, and the golden plains in front. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2433"/>
      <stop offset=".3" stop-color="#3a3446"/>
      <stop offset=".46" stop-color="#7e5450"/>
      <stop offset=".56" stop-color="#d0874a"/>
      <stop offset=".62" stop-color="#f2c27a"/>
    </linearGradient>
    <radialGradient id="glow" cx="640" cy="330" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff0c8" stop-opacity=".9"/>
      <stop offset=".22" stop-color="#f6bf72" stop-opacity=".5"/>
      <stop offset="1" stop-color="#f6bf72" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3c48a" stop-opacity="0"/>
      <stop offset=".5" stop-color="#f3c48a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#f3c48a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8664a"/>
      <stop offset="1" stop-color="#6e3f36"/>
    </linearGradient>
    <linearGradient id="bluff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a4c"/>
      <stop offset="1" stop-color="#5a3c36"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a07060"/>
      <stop offset="1" stop-color="#c49470"/>
    </linearGradient>
    <linearGradient id="hills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f8a3e"/>
      <stop offset="1" stop-color="#5a5826"/>
    </linearGradient>
    <linearGradient id="plain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a8a38"/>
      <stop offset=".5" stop-color="#6e5e24"/>
      <stop offset="1" stop-color="#3a2c14"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4cf94"/>
      <stop offset="1" stop-color="#b48a5e"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0a08" stop-opacity="0"/>
      <stop offset="1" stop-color="#0c0a08"/>
    </linearGradient>
    <pattern id="grass" width="60" height="40" patternUnits="userSpaceOnUse">
      <path d="M6 40 Q8 24 4 14 M10 40 Q12 26 16 18 M14 40 Q13 30 10 24 M34 40 Q36 22 32 10 M38 40 Q40 28 46 20 M42 40 Q41 30 38 26 M52 40 Q54 30 58 26"
            fill="none" stroke="#e0b060" stroke-width="1.6" stroke-linecap="round" opacity=".45"/>
    </pattern>
    <!-- a pine: three stacked tiers and a trunk, 0,0 at its foot -->
    <g id="pine">
      <rect x="-2" y="-14" width="4" height="14" fill="#2a1e12"/>
      <path d="M0 -70 L-12 -40 L-6 -40 L-18 -18 L18 -18 L6 -40 L12 -40z"/>
      <path d="M0 -52 L-22 -12 L22 -12z"/>
    </g>
  </defs>

  <rect width="1600" height="560" fill="url(#sky)"/>
  <rect width="1600" height="560" fill="url(#glow)"/>

  <!-- Low sun, thin clouds -->
  <circle cx="640" cy="322" r="30" fill="#fff1cc"/>
  <g fill="#f6cf94" opacity=".45">
    <path d="M90 170 q140 -16 300 -2 q-150 12 -300 2z"/>
    <path d="M440 120 q180 -18 380 0 q-190 14 -380 0z"/>
    <path d="M980 96 q160 -14 320 0 q-160 12 -320 0z"/>
    <path d="M1180 190 q130 -10 260 0 q-130 8 -260 0z" opacity=".7"/>
    <path d="M720 220 q110 -8 220 0 q-110 7 -220 0z" opacity=".6"/>
  </g>
  <!-- a floating mesa far off in the haze -->
  <path d="M760 214 q14 -22 40 -18 q20 -14 38 4 q16 2 12 18 q-30 14 -52 6 q-26 8 -38 -10z" fill="#c9a08a" opacity=".35"/>

  <!-- Distant ridge in the haze -->
  <path d="M0 338 Q120 318 240 328 T480 322 T720 332 T960 318 T1200 328 T1440 316 T1600 326 V380 H0z" fill="url(#far)" opacity=".7"/>

  <!-- Thunder Bluff: a sheer cliff with tents, totems and the elevator tower on top -->
  <g>
    <path d="M60 400 L74 300 L92 286 L150 282 L170 270 L300 268 L330 280 L400 282 L418 300 L436 400z" fill="url(#bluff)"/>
    <path d="M92 400 L100 296 L118 288 L126 400z M210 400 L216 276 L232 274 L230 400z M330 400 L338 286 L352 286 L350 400z"
          fill="#b07a5e" opacity=".35"/>
    <g fill="#3a2628">
      <rect x="112" y="226" width="12" height="58"/>
      <rect x="104" y="222" width="28" height="10"/>
      <rect x="108" y="244" width="20" height="5"/>
      <path d="M180 270 l14 -30 l14 30z M226 268 l18 -38 l18 38z M286 268 l12 -26 l12 26z M360 282 l10 -22 l10 22z"/>
      <rect x="258" y="232" width="4" height="36"/>
      <rect x="252" y="238" width="16" height="4"/>
    </g>
    <path d="M244 230 l-5 -9 M244 230 l5 -9 M194 240 l-4 -8 M194 240 l4 -8" stroke="#3a2628" stroke-width="2"/>
  </g>

  <!-- The red mesas: fluted rock columns, their west faces lit by the sun -->
  <g fill="url(#rock)">
    <path d="M930 400 L944 340 Q950 318 972 318 Q990 318 996 340 L1004 300 Q1008 272 1032 272 Q1052 272 1058 296 L1066 330
             L1080 262 Q1086 236 1108 236 Q1130 236 1136 262 L1146 304 L1160 250 Q1166 226 1190 226 Q1214 226 1220 252
             L1232 300 L1250 290 Q1270 282 1290 290 L1310 300 L1320 262 Q1326 240 1348 240 Q1368 240 1374 262 L1388 320
             L1430 332 Q1460 340 1470 360 L1490 400z"/>
  </g>
  <g fill="#f0a070" opacity=".28">
    <path d="M944 400 L950 336 Q956 320 968 320 L962 400z"/>
    <path d="M1010 400 L1012 296 Q1016 276 1030 274 L1024 400z"/>
    <path d="M1086 400 L1088 260 Q1094 240 1106 238 L1100 400z"/>
    <path d="M1166 400 L1168 248 Q1174 230 1188 228 L1182 400z"/>
    <path d="M1326 400 L1328 260 Q1334 244 1346 242 L1340 400z"/>
  </g>
  <g stroke="#5a3028" stroke-width="2" opacity=".5" fill="none">
    <path d="M1038 290 v110 M1048 300 v100 M1116 260 v140 M1126 270 v130 M1198 250 v150 M1208 262 v138 M1356 262 v138"/>
  </g>

  <!-- Mist settling over the valley -->
  <rect y="330" width="1600" height="90" fill="url(#mist)"/>

  <!-- Rolling hills -->
  <path d="M0 404 C140 386 280 396 420 402 S700 388 860 400 S1140 414 1300 404 S1500 392 1600 400 V470 H0z" fill="url(#hills)"/>

  <!-- The river by Bloodhoof Village -->
  <path d="M560 418 C640 410 760 412 860 418 C900 421 900 427 860 428 C760 432 640 430 560 426 C530 424 530 420 560 418z" fill="url(#water)" opacity=".8"/>

  <!-- Bloodhoof Village: tents, a longhouse and totems -->
  <g>
    <path d="M700 414 l18 -38 l18 38z" fill="#d9b37c"/>
    <path d="M718 376 l-5 -9 M718 376 l5 -9" stroke="#3a2a1a" stroke-width="2"/>
    <path d="M704 404 h28" stroke="#8c3a22" stroke-width="3"/>
    <path d="M748 414 l22 -46 l22 46z" fill="#e2c08a"/>
    <path d="M770 368 l-6 -10 M770 368 l6 -10" stroke="#3a2a1a" stroke-width="2"/>
    <path d="M754 400 h32" stroke="#2e5a6a" stroke-width="3"/>
    <path d="M764 414 l6 -14 l6 14z" fill="#3a2a1a"/>
    <path d="M800 414 v-18 q30 -16 60 0 v18z" fill="#a8743e"/>
    <path d="M800 396 q30 -16 60 0" stroke="#5a3a1c" stroke-width="3" fill="none"/>
    <path d="M870 414 l14 -30 l14 30z" fill="#d0a870"/>
    <rect x="684" y="372" width="5" height="42" fill="#5a3a1c"/>
    <rect x="680" y="372" width="13" height="8" fill="#8c3a22"/>
    <rect x="680" y="386" width="13" height="7" fill="#2e5a6a"/>
    <rect x="904" y="380" width="4" height="34" fill="#5a3a1c"/>
    <rect x="900" y="380" width="12" height="7" fill="#b5773a"/>
    <path d="M790 412 q4 -12 -2 -22 q10 8 4 22z" fill="#ffd27a" opacity=".85"/>
  </g>

  <!-- Pines across the valley, small in the distance -->
  <g fill="#3c4426">
    <use href="#pine" transform="translate(470 408) scale(.7)"/>
    <use href="#pine" transform="translate(500 412) scale(.9)"/>
    <use href="#pine" transform="translate(528 406) scale(.6)"/>
    <use href="#pine" transform="translate(630 410) scale(.75)"/>
    <use href="#pine" transform="translate(940 412) scale(.8)"/>
    <use href="#pine" transform="translate(972 408) scale(.6)"/>
    <use href="#pine" transform="translate(1440 404) scale(.85)"/>
    <use href="#pine" transform="translate(1480 408) scale(.65)"/>
  </g>

  <!-- Golden foreground plain, with the road winding down to the village -->
  <path d="M0 440 C200 420 400 432 600 440 S1000 426 1200 436 S1460 450 1600 432 V560 H0z" fill="url(#plain)"/>
  <path d="M0 440 C200 420 400 432 600 440 S1000 426 1200 436 S1460 450 1600 432 V560 H0z" fill="url(#grass)"/>
  <path d="M1060 560 C1060 520 1180 500 1150 476 C1120 456 980 452 900 432 C960 450 1090 462 1100 478 C1112 500 1000 526 990 560z"
        fill="#c8a670" opacity=".45"/>

  <!-- Big pines in front, on the right -->
  <g fill="#2c3420">
    <use href="#pine" transform="translate(1240 470) scale(2.2)"/>
    <use href="#pine" transform="translate(1300 462) scale(1.6)"/>
    <use href="#pine" transform="translate(1530 466) scale(1.9)"/>
  </g>
  <g fill="#5a6a30" opacity=".35">
    <path d="M1240 316 L1214 382 L1240 370z M1300 350 L1282 396 L1300 386z"/>
  </g>

  <!-- Totem in the foreground -->
  <g transform="translate(190 520) scale(1.3)">
    <rect x="-9" y="-112" width="18" height="112" fill="#4a2e14"/>
    <rect x="-13" y="-112" width="26" height="22" rx="3" fill="#8c3a22"/>
    <rect x="-13" y="-84" width="26" height="20" rx="3" fill="#2e5a6a"/>
    <rect x="-13" y="-58" width="26" height="20" rx="3" fill="#b5773a"/>
    <path d="M-13 -106 l-30 -10 l6 14z M13 -106 l30 -10 l-6 14z" fill="#d9a35b"/>
    <path d="M-5 -102 h3 M2 -102 h3 M-5 -76 h3 M2 -76 h3 M-5 -50 h3 M2 -50 h3" stroke="#16130f" stroke-width="2"/>
    <path d="M-2 -126 l2 -14 l2 14z" fill="#ffe2a8"/>
  </g>

  <rect y="430" width="1600" height="130" fill="url(#fade)"/>
</svg>
