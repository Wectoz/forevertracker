<html><body><script id="model">model = {"paginationLinks":{"current":"/en-us/news?page=1","next":"/en-us/news?page=3","previous":null},"blogList":{"blogs":[{"id":24307310,"title":"Hotfixes: October 23, 2026","slug":"hotfixes-october-23-2026","url":"/news/24307310/hotfixes-october-23-2026","description":"Here you will find a list of hotfixes that address various issues related to World of Warcraft: Midnight, Mists of Pandaria Classic, Season of Discovery, The Burning Crusade Classic, WoW Classic Era, and Hardcore.","category":"12.1.5","tags":["update notes","hotfixes"],"keywords":["12.1.5","Update Notes","Hotfixes","WoW","Midnight","Patch Notes"],"published":"2026-10-23T23:43:00.000Z","updated":"2026-10-24T00:21:06.563Z"},{"id":24313106,"title":"Dive Into WoW: Forever, the Gods of Zul’Aman, Hallow’s End, and More in WoW Weekly","slug":"dive-into-wow-forever-the-gods-of-zulaman-hallows-end-and-more-in-wow-weekly","url":"/news/24313106/dive-into-wow-forever-the-gods-of-zulaman-hallows-end-and-more-in-wow-weekly","description":"From the latest news in World of Warcraft: Forever to the launch of the Gods of Zul'Aman content update in Burning Crusade Classic Anniversary, this week's news is packed with fresh insights, eerie in-game events, new rewards, and adventures to explore across Azeroth.","category":null,"tags":[],"keywords":null,"published":"2026-10-23T17:01:00.000Z","updated":"2026-10-23T17:06:22.447Z"},{"id":24313104,"title":"Watch the World of Warcraft: Midnight Motion Comic, “Singularity”","slug":"watch-the-world-of-warcraft-midnight-motion-comic-singularity","url":"/news/24313104/watch-the-world-of-warcraft-midnight-motion-comic-singularity","description":"Join Arator Windrunner as he ventures into the depths of the Void with the aid of his mentor, Umbric, in search of clues about his missing parents' fate. Along the way, he must learn to confront the Void without losing himself to it.","category":null,"tags":[],"keywords":null,"published":"2026-10-23T17:00:00.000Z","updated":"2026-10-23T17:04:43.303Z"},{"id":24310652,"title":"BCCA: The Gods of Zul'Aman Now Live","slug":"bcca-the-gods-of-zulaman-now-live","url":"/news/24310652/bcca-the-gods-of-zulaman-now-live","description":"Journey into the eerie Ghostlands, just south of the once-beautiful elven kingdom of Quel'Thalas, and brave the Amani stronghold of Zul'Aman.","category":null,"tags":[],"keywords":null,"published":"2026-10-22T22:00:00.000Z","updated":"2026-10-22T22:23:43.347Z"},{"id":24302577,"title":"Dive into the End of Beta Special!","slug":"dive-into-the-end-of-beta-special","url":"/news/24302577/dive-into-the-end-of-beta-special","description":"Join WoW: Forever Podcast host Countdown To Classic and special guest Meeix as they sit down with Senior Game Designer Josh “Aggrend” Greenfield, Associate Production Director Clay Stone, Lead Software Engineer Ana Resendez, and Lead Encounter Designer Michael Nuthals for a special episode.","category":null,"tags":[],"keywords":null,"published":"2026-10-22T16:15:00.000Z","updated":"2026-10-22T16:16:45.551Z"},{"id":24302070,"title":"[Updated 10/22] Choose Your Ruleset in World of Warcraft: Forever","slug":"updated-1022-choose-your-ruleset-in-world-of-warcraft-forever","url":"/news/24302070/updated-1022-choose-your-ruleset-in-world-of-warcraft-forever","description":"World of Warcraft: Forever is taking a new approach to where and how players begin their journey. Instead of choosing from a long list of realms, players will select a ruleset—Normal, PvP, Roleplaying, or Hardcore—that matches how they want to experience Azeroth. Each option operates as its own large ecosystem for grouping, dungeons, raids, and community, with Hardcore joining the available lineup sometime after launch.","category":null,"tags":[],"keywords":null,"published":"2026-10-22T15:44:03.763Z","updated":"2026-10-22T15:44:03.708Z"},{"id":24313103,"title":"Get Up to 50% In Fall Savings Through November 2","slug":"get-up-to-50-in-fall-savings-through-november-2","url":"/news/24313103/get-up-to-50-in-fall-savings-through-november-2","description":"Join the autumnal festivities with deals on Midnight, fashionable Transmogs, select Game Services, and more!","category":null,"tags":[],"keywords":null,"published":"2026-10-21T20:04:00.000Z","updated":"2026-10-22T21:58:35.628Z"},{"id":24301516,"title":"Gather Around the Campfire in World of Warcraft: Forever","slug":"gather-around-the-campfire-in-world-of-warcraft-forever","url":"/news/24301516/gather-around-the-campfire-in-world-of-warcraft-forever","description":"The Camping system in World of Warcraft: Forever lets players create shared campsites where they can rest, craft, and gain useful benefits from profession-made features. Beginning with the Cooking profession’s Basic Campfire, the system gives adventurers new reasons to prepare together and connect while traveling through Azeroth.","category":null,"tags":[],"keywords":null,"published":"2026-10-21T17:00:00.000Z","updated":"2026-10-21T17:01:11.308Z"},{"id":24303866,"title":"Claim Your World of Warcraft: Forever Character Names","slug":"claim-your-world-of-warcraft-forever-character-names","url":"/news/24303866/claim-your-world-of-warcraft-forever-character-names","description":"Get ready to make your mark in Azeroth! World of Warcraft: Forever Early Name reservations will be available from October 27 through November 3, offering an early opportunity to reserve names for up to three characters.","category":null,"tags":[],"keywords":null,"published":"2026-10-20T21:00:00.000Z","updated":"2026-10-20T20:52:17.165Z"},{"id":24303009,"title":"World of Warcraft: Forever Raid Overview—Locations, Raid Sizes, and Attunement","slug":"world-of-warcraft-forever-raid-overview-locations-raid-sizes-and-attunement","url":"/news/24303009/world-of-warcraft-forever-raid-overview-locations-raid-sizes-and-attunement","description":"Barrow Deeps, Hyjal Summit, and Onyxia’s Lair unlock in World of Warcraft: Forever on December 9. Learn where to find each level 60 raid, how many players you’ll need, and how to earn the Drakefire Amulet required to enter Onyxia’s Lair.","category":null,"tags":[],"keywords":null,"published":"2026-10-20T19:00:00.000Z","updated":"2026-10-20T17:54:01.715Z"},{"id":24301455,"title":"Explore the New Dungeons of World of Warcraft: Forever","slug":"explore-the-new-dungeons-of-world-of-warcraft-forever","url":"/news/24301455/explore-the-new-dungeons-of-world-of-warcraft-forever","description":"Explore nine new World of Warcraft: Forever dungeons across the Eastern Kingdoms and Kalimdor, with level ranges from 13 to 60. Venture beneath familiar cities, beyond sealed gates, and into long-unexplored corners of Azeroth.","category":null,"tags":[],"keywords":null,"published":"2026-10-20T17:00:00.000Z","updated":"2026-10-20T16:44:22.478Z"},{"id":24310657,"title":"Channel Your Inner Rexxar with this Beastly Bundle","slug":"channel-your-inner-rexxar-with-this-beastly-bundle","url":"/news/24310657/channel-your-inner-rexxar-with-this-beastly-bundle","description":"The wildest pack filled with in-game items that invoke the Spirit of Rexxar awaits your modern World of Warcraft (currently Midnight™) characters. For a limited time, get a transmog set, a toy to make Hunter combat pets look like Rexxar’s loyal combat pets, and a housing decor item worthy of a Beastmaster!","category":null,"tags":["modern"],"keywords":null,"published":"2026-10-19T23:43:00.000Z","updated":"2026-10-19T23:43:22.262Z"},{"id":24310656,"title":"Hallow's End Brings Frights, Delights, and Haunting Rewards","slug":"hallows-end-brings-frights-delights-and-haunting-rewards","url":"/news/24310656/hallows-end-brings-frights-delights-and-haunting-rewards","description":"Hallow’s End celebrates the Forsaken's break from the Scourge. Fun and mischief reign as the Innkeepers of Azeroth dole out treats and tricks to those who partake in the festivities.","category":null,"tags":[],"keywords":null,"published":"2026-10-19T17:00:00.000Z","updated":"2026-10-22T20:28:25.411Z"},{"id":24313102,"title":"WoW Weekly Highlights Midnight 12.1.5, Worldcore, WoW: Forever, and More","slug":"wow-weekly-highlights-midnight-1215-worldcore-wow-forever-and-more","url":"/news/24313102/wow-weekly-highlights-midnight-1215-worldcore-wow-forever-and-more","description":"From new challenges in Midnight and a glimpse of what’s ahead in Echoes of the Worldcore to a deep dive into Paladins and the latest WoW: Forever Podcast, this week's news is packed with fresh insights, new rewards, and adventures to explore across Azeroth.","category":null,"tags":[],"keywords":null,"published":"2026-10-16T17:00:00.000Z","updated":"2026-10-16T15:00:32.013Z"},{"id":24302072,"title":"[Updated Oct 16] Join the World of Warcraft: Forever Stress Test","slug":"updated-oct-16-join-the-world-of-warcraft-forever-stress-test","url":"/news/24302072/updated-oct-16-join-the-world-of-warcraft-forever-stress-test","description":"The gates are opening for the World of Warcraft: Forever Stress Test. For a limited time on October 21, all interested players can sign into World of Warcraft: Forever and help us put the servers through their paces. Anyone can take part and no subscription, Game Time, invitation, or beta access is required.","category":null,"tags":[],"keywords":null,"published":"2026-10-15T21:00:00.000Z","updated":"2026-10-17T01:02:58.365Z"},{"id":24310658,"title":"Unlock a Year of World of Warcraft® and Get Bonus Treasures","slug":"unlock-a-year-of-world-of-warcraft-and-get-bonus-treasures","url":"/news/24310658/unlock-a-year-of-world-of-warcraft-and-get-bonus-treasures","description":"Claim a 12-Month Subscription or 365-Days Game Time and get bonus in-game cosmetic items, including several for use in World of Warcraft: Forever!","category":null,"tags":[],"keywords":null,"published":"2026-10-15T20:12:00.000Z","updated":"2026-10-16T00:25:54.238Z"},{"id":24302099,"title":"World of Warcraft: Forever Class Deep Dives — Paladin","slug":"world-of-warcraft-forever-class-deep-dives-paladin","url":"/news/24302099/world-of-warcraft-forever-class-deep-dives-paladin","description":"Stand as a champion of the Light in this World of Warcraft: Forever class deep dive. Discover how Paladin updates strengthen the class’s distinctive Seals and Judgements while expanding options for Holy healing and spell damage, Protection tanking, and Retribution damage.","category":null,"tags":[],"keywords":null,"published":"2026-10-15T19:00:00.000Z","updated":"2026-10-15T19:44:59.624Z"},{"id":24304079,"title":"Explore PvP in Episode 4 of the WoW: Forever Podcast","slug":"explore-pvp-in-episode-4-of-the-wow-forever-podcast","url":"/news/24304079/explore-pvp-in-episode-4-of-the-wow-forever-podcast","description":"Join WoW: Forever Podcast host Countdown To Classic and special guests Savix and Tips Out as they sit down with Senior Game Designer Josh “Aggrend” Greenfield and Lead Designer Tim Jones as they dive into Player-vs-Player (PvP) in World of Warcraft: Forever.","category":null,"tags":[],"keywords":null,"published":"2026-10-15T16:15:00.000Z","updated":"2026-10-15T16:15:45.069Z"},{"id":24310659,"title":"Midnight: Echoes of the Worldcore Overview","slug":"midnight-echoes-of-the-worldcore-overview","url":"/news/24310659/midnight-echoes-of-the-worldcore-overview","description":"The next Midnight content update, Echoes of the Worldcore, invites you back to Dornogal for a dramatic new story campaign, introduces a terrifying new game mode—Talebound, offers a fresh set of Lorewalking quests, brings new rewards for Turbulent Timeways, and more.","category":null,"tags":[],"keywords":null,"published":"2026-10-15T16:00:00.000Z","updated":"2026-10-20T16:43:38.651Z"},{"id":24307306,"title":"Midnight's 12.1.5 Content Update is Now Live","slug":"midnights-1215-content-update-is-now-live","url":"/news/24307306/midnights-1215-content-update-is-now-live","description":"Midnight’s 12.1.5 content update brings the Labyrinth of Kindo’jan—a massive nine-chamber Delve-like challenge, a new single-boss raid, Season 2's mid-season refresh, the dramatic conclusion to the saga of Quel’Thalas and Zul’Aman, Aqir Invasions, and more.","category":null,"tags":[],"keywords":null,"published":"2026-10-13T21:51:00.000Z","updated":"2026-10-13T21:51:14.973Z"}]}};</script></body></html>
