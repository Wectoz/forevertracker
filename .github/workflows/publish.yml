# Gathers new WoW Forever posts from Blizzard every hour and publishes the site to GitHub Pages.
name: Publish site

on:
  push:
    branches: [master]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - run: uv sync

      - name: Run tests
        if: github.event_name != 'schedule'
        run: uv run pytest -q

      # The gathered posts live in a cache between runs; if it is ever evicted, backfill rebuilds it.
      # Bump the "v2" prefix to force one full backfill (v2: posts gained thumbnails).
      - name: Restore gathered posts
        uses: actions/cache/restore@v4
        with:
          path: instance
          key: posts-v2-${{ github.run_id }}
          restore-keys: posts-v2-

      - name: Gather from Blizzard
        # A Blizzard outage must not stop publishing: the site is rebuilt from what is already stored.
        continue-on-error: true
        run: |
          if [ -f instance/wowforever.sqlite3 ]; then
            uv run wowforever fetch
          else
            uv run wowforever backfill
          fi

      # Posts to Discord only when the DISCORD_WEBHOOK_URL secret is set. Before the cache is saved,
      # so the record of what was announced is kept for the next run.
      - name: Announce new posts on Discord
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: uv run wowforever announce

      - name: Save gathered posts
        if: always()
        uses: actions/cache/save@v4
        with:
          path: instance
          key: posts-v2-${{ github.run_id }}

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: uv run wowforever build --out _site --site-url "${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
