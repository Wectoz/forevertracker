# Refreshes realm status every 10 minutes, gathers new WoW Forever posts hourly, and publishes the site to GitHub Pages.
name: Publish site

on:
  push:
    branches: [master]
  schedule:
    - cron: "4-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - run: uv sync

      - name: Run tests
        if: github.event_name != 'schedule'
        run: uv run pytest -q

      # The gathered posts live in a cache between runs; if it is ever evicted, backfill rebuilds it.
      # Bump the "v2" prefix to force one full backfill (v2: posts gained thumbnails).
      - name: Restore gathered posts
        uses: actions/cache/restore@v4
        with:
          path: instance
          key: posts-v2-${{ github.run_id }}
          restore-keys: posts-v2-

      # News and forum posts are gathered about hourly; the scheduled runs in between only refresh realm status.
      # A missing gathered-at (first run after a deploy, or an evicted cache) means gather now.
      - name: Check whether posts are due
        id: due
        run: |
          gather=false
          if [ "${{ github.event_name }}" != "schedule" ] || [ ! -f instance/gathered-at ]; then
            gather=true
          else
            last=$(cat instance/gathered-at)
            if [ $(( $(date +%s) - last )) -ge 3000 ]; then gather=true; fi
          fi
          echo "gather=$gather" >> "$GITHUB_OUTPUT"

      - name: Gather from Blizzard
        if: steps.due.outputs.gather == 'true'
        # A Blizzard outage must not stop publishing: the site is rebuilt from what is already stored.
        continue-on-error: true
        run: |
          # Stamp the time even if gathering fails, so an outage doesn't hit Blizzard every 10 minutes.
          mkdir -p instance
          trap 'date +%s > instance/gathered-at' EXIT
          if [ -f instance/wowforever.sqlite3 ]; then
            uv run wowforever fetch
          else
            uv run wowforever backfill
          fi

      # Posts to Discord only when the DISCORD_WEBHOOK_URL secret is set. Before the cache is saved,
      # so the record of what was announced is kept for the next run.
      - name: Announce new posts on Discord
        if: steps.due.outputs.gather == 'true'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: uv run wowforever announce

      # Skips itself when the Blizzard API secrets are not set. Runs every time.
      - name: Realm status
        continue-on-error: true
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: uv run wowforever realms

      - name: Save gathered posts
        if: always()
        uses: actions/cache/save@v4
        with:
          path: instance
          key: posts-v2-${{ github.run_id }}

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: uv run wowforever build --out _site --site-url "${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
